name: Build Android Touch Mod (experimental)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Add Stardew Valley libraries
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@v1
      - name: Build
        run: dotnet build MultipleMiniObelisks.csproj -c Release
      - name: Upload compiled files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MultipleMiniObelisks-Android-test
          path: |
            bin/Release/net6.0/MultipleMiniObelisks.dll
            manifest.json
